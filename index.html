<title>Bonding Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: mode bar and substance picker on top; working steps on the left; sticky dot-and-cross workbench on the right.
   Colour logic: blue dots and red crosses are the two electron "owners", so they are the only saturated colours. */
:root,:root[data-theme="dark"]{
  /* Science Revision Hub look. Subject accent: Chemistry = pink. */
  --paper:#0E1020; --panel:#181B33; --raise:#20244A; --raise2:#292E5E; --ink:#E4E7F7; --head:#FFFFFF; --ink2:#A3A8C9; --line:#343A70; --grid:#1D2142; --sel:#2C3166;
  --dot:#4CC9F0; --cross:#FF7AA8; --lime:#B8F34A;
  --ok:#B8F34A; --okfg:#0E1020; --okbg:rgba(184,243,74,.09); --bad:#FF9D5C; --badbg:rgba(255,157,92,.12); --warn:#FFD166; --warnbg:#33290F;
  --accent:#FF7AA8; --accentfg:#0E1020; color-scheme:dark;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --paper:#F3F4FF; --panel:#FFFFFF; --raise:#EAECFB; --raise2:#DDE0F7; --ink:#1C2040; --head:#1C2040; --ink2:#4E547E; --line:#C3C8EA; --grid:#E3E6F8; --sel:#DDE0F7;
  --dot:#0A77A0; --cross:#C4165E; --lime:#3D7A05;
  --ok:#3D7A05; --okfg:#FFFFFF; --okbg:rgba(61,122,5,.08); --bad:#C2410C; --badbg:rgba(194,65,12,.08); --warn:#7A5200; --warnbg:#FFF0D1;
  --accent:#C4165E; --accentfg:#FFFFFF; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap .wrap{width:100%;margin:0;min-width:0}
h1{font:800 clamp(40px,7vw,72px)/.98 var(--f-display);letter-spacing:-.03em;margin:0}

.hbtn{border:1.5px solid var(--line);background:var(--raise);color:var(--ink);border-radius:999px;padding:7px 16px;font:700 14px var(--f-body);cursor:pointer;transition:transform .15s,background .15s}
.hbtn:hover{background:var(--raise2);transform:translateY(-1px)}
.hbtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
header{padding-right:0}

@media (prefers-reduced-motion:reduce){.hbtn{transition:none}.hbtn:hover{transform:none}}
h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;color:var(--head);text-wrap:balance;margin:0}

button{font:inherit;color:inherit;cursor:pointer}

.mode{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--raise);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}

.spacer{flex:1}

.builder{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}

select,input[type=number],input[type=text]{font:500 16px var(--f-mono);background:var(--raise);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
input[type=number]{width:74px}
input[type=text]{width:140px}
.note{margin:8px 0 0;color:var(--ink2);font-size:15px}
.note.err{color:var(--bad)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:901px){.diagwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}

.progress{font-size:14px;color:var(--ink2)}
.bar{height:6px;background:var(--grid);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}

.step header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.step h3{font-size:18px;flex:1}
.tag{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accentfg);font:600 13px var(--f-mono);display:grid;place-items:center}
.step.done .tag{background:var(--ok);color:var(--okfg)}

.pill.bad{background:var(--badbg);color:var(--bad)}
.q{margin:0 0 10px}
.fields{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.fld{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fld>span{min-width:92px;font-weight:600}
.fld em{font-style:normal;color:var(--ink2);font-size:15px}
.fld input.ok,.fld select.ok{border-color:var(--ok);background:var(--okbg)}
.fld input.bad,.fld select.bad{border-color:var(--bad);background:var(--badbg)}
.given{font:600 15px var(--f-mono);background:var(--grid);border-radius:8px;padding:5px 10px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.choice{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;text-align:left;font:600 16px var(--f-display)}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}

.actions{display:flex;gap:8px;flex-wrap:wrap}

.msg{margin:10px 0 0;font-size:15px;font-weight:500}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.hintbox{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:15px}
.explain{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--grid);font-size:15px;display:flex;flex-direction:column;gap:4px}
.explain p{margin:0}

.diag h3{font-size:18px}
.diag .dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.canvas{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:230px;display:grid;place-items:center;overflow:hidden}
.canvas svg{display:block;max-width:100%;height:auto}
.lock{text-align:center;color:var(--ink2);padding:24px;max-width:300px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin:10px 0 0;font-size:14px;color:var(--ink2);align-items:center}
.legend svg{vertical-align:middle}
.counter{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.counter button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:600 18px var(--f-mono)}
.counter output{font:600 22px var(--f-mono);min-width:1.5em;text-align:center}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.props{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ink);font-size:15px}
.props b{color:var(--ok)}
.done-card{text-align:left;display:flex;flex-direction:column;gap:8px}
.done-card h3{font-size:22px}

/* SVG pieces */
.shell{fill:none;stroke:var(--ink2);stroke-width:1.6}
.shell.ion{stroke:var(--ink);stroke-width:1.8}
.sym{font:700 17px var(--f-display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.sym.sm{font-size:15px}
.chg{font:600 15px var(--f-mono);fill:var(--ink);text-anchor:start}
.brk{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.ring{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 2.4}
.ring.bad{stroke:var(--bad);stroke-width:1.8;stroke-dasharray:none}
.ring.hinted{stroke:var(--warn);stroke-width:1.8;stroke-dasharray:none}
.ring.target{stroke:var(--cross);stroke-dasharray:2 2}
.hit{fill:transparent;cursor:pointer}
.e-dot{fill:var(--dot)}
.e-ring{fill:color-mix(in srgb,var(--cross) 14%,transparent);stroke:var(--cross);stroke-width:1.3}
.e-gain{fill:var(--ok);stroke:var(--panel);stroke-width:.8}
.ionrow{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-start;justify-content:center;padding:10px 6px}
.ionfig{margin:0;text-align:center;max-width:100%}.ionfig figcaption{font-size:14px;color:var(--ink2);margin-top:2px}.ionfig figcaption b{color:var(--ink)}
.ionplus{align-self:center;font:600 22px var(--f-mono);color:var(--ink2);padding:0 2px}
.e-cross{stroke:var(--cross);stroke-width:1.9;stroke-linecap:round;fill:none}
.arrow{fill:none;stroke:var(--ink2);stroke-width:1.5}
.cap{font:500 11px var(--f-body);fill:var(--ink2);text-anchor:middle}
.sea{fill:var(--cross);opacity:.08}
.latcap{font:500 12px var(--f-body);fill:var(--ink2);text-anchor:middle}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}100%{transform:translate(0,0)}}
.drift{animation:drift 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.drift{animation:none}.bar i{transition:none}}

.views{display:flex;gap:8px;flex-wrap:wrap}
.view{border:1.5px solid var(--line);color:var(--ink);background:var(--raise);border-radius:999px;padding:9px 20px;font:700 16px var(--f-display);transition:background .15s,transform .15s}
.view:hover{background:var(--raise2);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.view{transition:none}.view:hover{transform:none}}

.glayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:18px;align-items:start}

.gl{margin:0;display:grid;gap:4px 0}

.qopt{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;text-align:left}

.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;min-width:720px;width:100%;font-size:15px}

.tbl .sel{background:var(--sel)}
.gatom{fill:var(--panel);stroke:var(--ink2);stroke-width:1.5}

.attr{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:2 3}

.sym.xs{font-size:9px}
.cfg{display:flex;gap:14px 24px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}

.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink2);font-size:15px}
.big-f{font:600 34px var(--f-mono)}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}
.rev p{margin:0 0 6px}

.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.chip.bad{border-color:var(--bad);background:var(--badbg)}.chip.ok{border-color:var(--ok);background:var(--okbg)}
.clues{margin:0 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.cap{paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
[hidden]{display:none!important}
.dtok .tokhit{cursor:grab}.dtok.live:hover .tokhit{stroke:var(--sel);stroke-width:1.5}
.progressline{font-size:15px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}

/* right / wrong marks always carry an icon, never colour alone */
.qopt.ok::before,.choice.ok::before,.msg.ok::before,.pill.ok::before{content:"\2713\00a0";font-weight:800}

.ring.bad{stroke-dasharray:3 2}

.choice,.qopt{background:var(--raise)}

.grp b{font:800 18px var(--f-display);letter-spacing:-.02em;color:var(--head)}
.grp span{font-size:14px;color:var(--ink2)}

.grp[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}

<script>
/* ---------- Data ---------- */
const EL = {
  H:{n:'hydrogen',z:1,ve:1,cfg:'1',metal:false}, Li:{n:'lithium',z:3,ve:1,cfg:'2,1',metal:true},
  C:{n:'carbon',z:6,ve:4,cfg:'2,4',metal:false}, N:{n:'nitrogen',z:7,ve:5,cfg:'2,5',metal:false},
  O:{n:'oxygen',z:8,ve:6,cfg:'2,6',metal:false}, F:{n:'fluorine',z:9,ve:7,cfg:'2,7',metal:false},
  Na:{n:'sodium',z:11,ve:1,cfg:'2,8,1',metal:true}, Mg:{n:'magnesium',z:12,ve:2,cfg:'2,8,2',metal:true},
  Al:{n:'aluminium',z:13,ve:3,cfg:'2,8,3',metal:true}, S:{n:'sulfur',z:16,ve:6,cfg:'2,8,6',metal:false},
  Cl:{n:'chlorine',z:17,ve:7,cfg:'2,8,7',metal:false}, K:{n:'potassium',z:19,ve:1,cfg:'2,8,8,1',metal:true},
  Ca:{n:'calcium',z:20,ve:2,cfg:'2,8,8,2',metal:true}, Br:{n:'bromine',z:35,ve:7,cfg:'2,8,18,7',metal:false}
};
const IDE = {O:'oxide',S:'sulfide',F:'fluoride',Cl:'chloride',Br:'bromide',N:'nitride'};
const VAL = {H:1,F:1,Cl:1,Br:1,O:2,N:3,C:4};
const COV = { // "central:terminal" -> number of terminal atoms
  'O:H':2,'N:H':3,'C:H':4,'Cl:H':1,'F:H':1,'Br:H':1,'C:Cl':4,'C:F':4,'C:Br':4,'C:O':2,'N:F':3,'N:Cl':3
};
const DIATOMIC = ['H','N','O','F','Cl','Br'];
const COVNAME = {H2:'hydrogen',Cl2:'chlorine',O2:'oxygen',N2:'nitrogen',F2:'fluorine',Br2:'bromine',HCl:'hydrogen chloride',HF:'hydrogen fluoride',
  HBr:'hydrogen bromide',H2O:'water',NH3:'ammonia',CH4:'methane',CO2:'carbon dioxide',CCl4:'tetrachloromethane',C2H4:'ethene'};
const PREFIX = ['','','di','tri','tetra'];

const gcd=(a,b)=>b?gcd(b,a%b):a;
const sub = s => s.replace(/(\d+)/g,'<sub>$1</sub>');
const chargeText = (n,sign) => (n===1?'':n)+(sign==='+'?'+':'−');

/* ---------- Problem makers ---------- */
function makeIonic(M,X){
  const cm=EL[M].ve, an=8-EL[X].ve, l=cm*an/gcd(cm,an), a=l/cm, b=l/an;
  if(a===1 && b>2) return null;
  const plain=M+(a>1?a:'')+X+(b>1?b:'');
  return {type:'ionic',M,X,cm,an,a,b,plain,html:sub(plain),name:EL[M].n+' '+IDE[X],els:[M,X]};
}
function makeCovalent(c,t,n){
  const order=VAL[t];
  let plain;
  if(c===t) plain=c+'2';
  else if(t==='H' && (c==='O'||['F','Cl','Br'].includes(c))) plain=(n>1?'H'+n:'H')+c;
  else plain=c+t+(n>1?n:'');
  if(c!==t && t==='H' && c!=='O' && !['F','Cl','Br'].includes(c)) plain=c+'H'+(n>1?n:'');
  let name=COVNAME[plain];
  if(!name){ name=EL[c].n+' '+PREFIX[n]+(n===1?'':'')+(IDE[t]||EL[t].n+'ide'); }
  return {type:'covalent',c,t,n,order,plain,html:sub(plain),name,els:c===t?[c]:[c,t]};
}
function makeEthene(){ return {type:'covalent',special:'ethene',c:'C',t:'H',n:4,order:1,plain:'C2H4',html:sub('C2H4'),name:'ethene',els:['C','H']}; }
function makeMetal(M){ return {type:'metallic',M,plain:M,html:M,name:EL[M].n,els:[M]}; }

const LIST = [];
['NaCl','MgO','MgCl2','CaCl2','Na2O','K2O','KBr','LiF','CaO','Al2O3'].forEach(f=>{
  const m=f.match(/^(Li|Na|K|Mg|Ca|Al)(\d?)(F|Cl|Br|O|S)(\d?)$/); LIST.push(makeIonic(m[1],m[3]));
});
[['H','H'],['Cl','Cl'],['O','O'],['N','N'],['F','F']].forEach(p=>LIST.push(makeCovalent(p[0],p[1],1)));
[['Cl','H',1],['F','H',1],['O','H',2],['N','H',3],['C','H',4],['C','O',2],['C','Cl',4]].forEach(p=>LIST.push(makeCovalent(p[0],p[1],p[2])));
LIST.push(makeEthene());
['Li','Na','K','Mg','Ca','Al'].forEach(m=>LIST.push(makeMetal(m)));
LIST.sort((a,b)=>a.name.localeCompare(b.name));

function customProblem(e1,e2){
  if(!e1) return {err:'Choose an element to start.'};
  const A=EL[e1], B=e2?EL[e2]:null;
  if(!e2){ return A.metal ? {p:makeMetal(e1)} : {err:'Pick a second element. Choose the same non-metal twice to build a diatomic molecule, such as O and O.'}; }
  if(A.metal && B.metal){ return e1===e2 ? {p:makeMetal(e1)} : {err:'Two different metals would make an alloy, which is outside this lab. Swap one for a non-metal.'}; }
  if(A.metal!==B.metal){
    const M=A.metal?e1:e2, X=A.metal?e2:e1;
    if(!IDE[X]) return {err:EL[X].n+' does not form a simple ion at this level. Try F, Cl, Br, O, S or N.'};
    const p=makeIonic(M,X);
    return p?{p}:{err:'That pair gives a 1:3 compound, a special case outside this lab. Try a different pair.'};
  }
  if(e1===e2) return DIATOMIC.includes(e1)?{p:makeCovalent(e1,e1,1)}:{err:e1+' does not form a simple diatomic molecule.'};
  for(const [c,t] of [[e1,e2],[e2,e1]]){ const n=COV[c+':'+t]; if(n) return {p:makeCovalent(c,t,n)}; }
  return {err:'That pair is not a standard IGCSE molecule. Try H with O, N, C or a halogen, or C with O or a halogen.'};
}

/* ---------- Geometry helpers ---------- */
const RAD=a=>a*Math.PI/180;
const SIDES=[270,0,90,180]; // screen angles (y down): top, right, bottom, left
const nearestSide=ang=>{ let best=SIDES[0],bd=999; SIDES.forEach(s=>{ let d=Math.abs(((ang-s+540)%360)-180); if(d<bd){bd=d;best=s;} }); return best; };
const dlt=R=>Math.asin(10/R)*180/Math.PI; // half-gap of an electron pair, 10px along the shell
const polar=(cx,cy,r,deg)=>[cx+r*Math.cos(RAD(deg)), cy+r*Math.sin(RAD(deg))];
function sideOrder(facing){ const o=[]; facing.forEach(s=>{if(!o.includes(s))o.push(s);}); [270,90,0,180].forEach(s=>{if(!o.includes(s))o.push(s);}); return o; }
/* electrons of one atom on 4 sides; q=0 first on every side, then q=1 on sides in reverse priority */
function shellSlots(cx,cy,R,count,order,kind){
  const out=[]; const pos=(side,q,paired)=>polar(cx,cy,R,side+(paired?(q?dlt(R):-dlt(R)):0));
  const paired=count>4;
  for(let i=0;i<Math.min(count,4);i++){ const [x,y]=pos(order[i],0,paired); out.push({x,y,expect:kind,side:order[i],q:0}); }
  const rev=order.slice().reverse();
  for(let i=0;i<count-4;i++){ const [x,y]=pos(rev[i],1,true); out.push({x,y,expect:kind,side:rev[i],q:1}); }
  return out;
}

/* ---------- Covalent scene ---------- */
function covLayout(n,lone){
  if(n===1) return [0];
  if(n===2) return lone>0?[218,322]:[180,0];
  if(n===3) return [200,270,340];
  return [0,90,180,270];
}
function covScene(P,stage){
  const atoms=[], bonds=[];
  const Rof=s=>s==='H'?32:46;
  const add=(sym,parent,ang,order)=>{ atoms.push({sym,parent,ang,order,R:Rof(sym)}); if(parent!=null) bonds.push({a:parent,b:atoms.length-1,order}); };
  if(P.special==='ethene'){
    add('C',null); add('C',0,0,2); add('H',0,135,1); add('H',0,225,1); add('H',1,45,1); add('H',1,315,1);
  } else if(P.c===P.t){ add(P.c,null); add(P.t,0,0,P.order); }
  else {
    add(P.c,null);
    const lone=(EL[P.c].ve-P.n*P.order)/2;
    let angs=covLayout(P.n,lone);
    if(P.n===1 && P.t==='H') angs=[180];
    angs.forEach(a=>add(P.t,0,a,P.order));
  }
  atoms.forEach((a,i)=>{
    if(a.parent==null){a.x=0;a.y=0;return;}
    const p=atoms[a.parent];
    const d=a.R+p.R-(stage==='atoms'?-26:16+8*(a.order-1));
    a.x=p.x+d*Math.cos(RAD(a.ang)); a.y=p.y-d*Math.sin(RAD(a.ang));
  });
  const syms=[...new Set(atoms.map(a=>a.sym))];
  atoms.forEach((a,i)=>{ a.type=syms.length===1?(i===0?'dot':'cross'):(a.sym===syms[0]?'dot':'cross'); a.label=a.sym; });
  atoms.forEach((a,i)=>{ a.bondSum=0; a.nbrs=[]; });
  bonds.forEach(b=>{ atoms[b.a].bondSum+=b.order; atoms[b.b].bondSum+=b.order; atoms[b.a].nbrs.push(b.b); atoms[b.b].nbrs.push(b.a); });
  const slots=[];
  if(stage==='atoms'){
    atoms.forEach(a=>{
      const faces=a.nbrs.map(j=>nearestSide(Math.atan2(atoms[j].y-a.y,atoms[j].x-a.x)*180/Math.PI));
      shellSlots(a.x,a.y,a.R,EL[a.sym].ve,sideOrder(faces),a.type).forEach(s=>{s.fixed=true;slots.push(s);});
    });
  } else {
    bonds.forEach((b,bi)=>{
      const A=atoms[b.a],B=atoms[b.b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,px=-uy,py=ux;
      const cl=(d-B.R+A.R)/2, cx=A.x+ux*cl, cy=A.y+uy*cl;
      const tA=A.type, tB=A.type===B.type?(A.type==='dot'?'cross':'dot'):B.type;
      for(let k=0;k<b.order;k++){
        const s=(k-(b.order-1)/2)*14, qx=cx+px*s, qy=cy+py*s;
        slots.push({x:qx-ux*5,y:qy-uy*5,expect:tA,g:'b'+bi}); slots.push({x:qx+ux*5,y:qy+uy*5,expect:tB,g:'b'+bi});
      }
    });
    atoms.forEach((a,ai)=>{
      const L=(EL[a.sym].ve-a.bondSum)/2; a.lone=L; if(L<=0) return;
      let sx=0,sy=0; a.nbrs.forEach(j=>{ const dx=atoms[j].x-a.x,dy=atoms[j].y-a.y,d=Math.hypot(dx,dy); sx+=dx/d; sy+=dy/d; });
      const phi=Math.hypot(sx,sy)<1e-6?270:Math.atan2(-sy,-sx)*180/Math.PI; a.phi=phi;
      const angs=L===1?[phi]:L===2?[phi-55,phi+55]:[phi,phi-90,phi+90];
      angs.forEach(t=>{ [-dlt(a.R),dlt(a.R)].forEach(dd=>{ const [x,y]=polar(a.x,a.y,a.R,t+dd); slots.push({x,y,expect:a.type,g:'l'+ai}); }); });
    });
  }
  atoms.forEach(a=>{ if(a.lone==null) a.lone=(EL[a.sym].ve-a.bondSum)/2; });
  const circles=atoms.map(a=>({x:a.x,y:a.y,R:a.R,label:a.sym,small:a.sym==='H'}));
  return {circles,slots,atoms,bonds,arrows:[],ions:[],legend:covLegend(atoms)};
}
function covLegend(atoms){
  const syms=[...new Set(atoms.map(a=>a.sym))];
  if(syms.length===1) return [{t:'dot',txt:'from one '+syms[0]+' atom'},{t:'cross',txt:'from the other '+syms[0]+' atom'}];
  return [{t:'dot',txt:'from '+syms[0]},{t:'cross',txt:'from '+syms[1]}];
}

/* ---------- Ionic scene ---------- */
function ionSeq(P){
  const seq=[]; const {a,b}=P;
  if(b>a){ for(let i=0;i<b;i++){ seq.push('a'); if(i<a) seq.push('c'); } }
  else { for(let i=0;i<a;i++){ seq.push('c'); if(i<b) seq.push('a'); } }
  return seq;
}
function ionScene(P,stage){
  const seq=ionSeq(P), fin=stage==='final';
  const items=seq.map(k=>({k,sym:k==='c'?P.M:P.X,R:fin?(k==='c'?44:52):46}));
  let x=0;
  items.forEach((it,i)=>{ if(i>0) x+=items[i-1].R+it.R+(fin?58:70); it.x=x; it.y=0; });
  const slots=[], circles=[], ions=[], arrows=[];
  items.forEach((it,i)=>{
    const facing=[]; if(i>0) facing.push(180); if(i<items.length-1) facing.push(0);
    const order=sideOrder(facing);
    it.facing=facing; it.order=order;
    circles.push({x:it.x,y:it.y,R:it.R,label:it.sym,ion:fin});
    if(fin){
      ions.push({x:it.x,y:it.y,R:it.R,charge:it.k==='c'?chargeText(P.cm,'+'):chargeText(P.an,'-')});
      if(it.k==='c'){
        const n=P.M==='Li'?2:8;
        const ord=P.M==='Li'?[270]:SIDES;
        for(let s=0;s<(n===2?1:4);s++) for(let q=0;q<2;q++){ const [px,py]=polar(it.x,it.y,it.R,ord[s]+(q?dlt(it.R):-dlt(it.R))); slots.push({x:px,y:py,expect:'cross',g:'i'+i}); }
      } else {
        const g=P.an;
        SIDES.forEach(s=>{ const [px,py]=polar(it.x,it.y,it.R,s-dlt(it.R)); slots.push({x:px,y:py,expect:'dot',g:'i'+i}); });
        order.forEach((s,j)=>{ const [px,py]=polar(it.x,it.y,it.R,s+dlt(it.R)); slots.push({x:px,y:py,expect:j<g?'cross':'dot',g:'i'+i}); });
      }
    } else {
      if(it.k==='c'){ shellSlots(it.x,it.y,it.R,EL[P.M].ve,order,'cross').forEach(s=>{s.fixed=true;slots.push(s);}); }
      else {
        const dots=shellSlots(it.x,it.y,it.R,EL[P.X].ve,order,'dot'); dots.forEach(s=>{s.fixed=true;slots.push(s);});
        const taken=dots.filter(s=>s.q===1).map(s=>s.side);
        const free=order.filter(s=>!taken.includes(s)).slice(0,P.an);
        free.forEach(s=>{ const [px,py]=polar(it.x,it.y,it.R,s+dlt(it.R)); slots.push({x:px,y:py,expect:'cross',target:true,fixed:true,owner:i}); });
      }
    }
  });
  if(!fin){
    const src=slots.filter(s=>!s.target&&s.expect==='cross'), tg=slots.filter(s=>s.target).slice();
    // arrows: from each metal electron to the nearest unfilled target
    const used=new Set();
    const cat=src.map(s=>({s,done:false}));
    cat.forEach(c=>{
      let bi=-1,bd=1e9; tg.forEach((t,i)=>{ if(used.has(i)) return; const d=Math.hypot(t.x-c.s.x,t.y-c.s.y); if(d<bd){bd=d;bi=i;} });
      if(bi>=0){ used.add(bi); const t=tg[bi]; arrows.push({x1:c.s.x,y1:c.s.y,x2:t.x,y2:t.y}); }
    });
  }
  return {circles,slots,arrows,ions,atoms:items,legend:[{t:'cross',txt:'electrons from '+P.M+' (metal)'},{t:'dot',txt:'electrons from '+P.X+' (non-metal)'}]};
}

/* ---------- Metallic scene ---------- */
function metScene(P,n,stage){
  const cols=4,rows=3,s=64,R=24, circles=[], slots=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) circles.push({x:c*s,y:r*s,R,label:P.M,charge:(stage==='final'&&n>0)?chargeText(n,'+'):'',metal:true});
  const base=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols-1;c++) base.push([(c+.5)*s,r*s]);
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols;c++) base.push([c*s,(r+.5)*s]);
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++) base.push([(c+.5)*s,(r+.5)*s]);
  const N=stage==='final'?n*cols*rows:0;
  const pick=[];
  if(N<=base.length){ for(let i=0;i<N;i++) pick.push(base[Math.floor(i*base.length/N)]); }
  else { base.forEach(p=>pick.push(p)); const extra=N-base.length; for(let i=0;i<extra;i++){ const p=base[Math.floor(i*base.length/extra)]; pick.push([p[0]+9,p[1]+9]); } }
  pick.forEach((p,i)=>slots.push({x:p[0],y:p[1],expect:'cross',fixed:true,drift:i}));
  return {circles,slots,arrows:[],ions:[],atoms:[],sea:N>0,legend:[{t:'cross',txt:'delocalised electron from a '+P.M+' atom'}]};
}
/* ---------- Renderer ---------- */
const f1=v=>Math.round(v*10)/10;
function glyph(kind,x,y,extra){
  if(kind==='gain') return '<circle class="e-ring" cx="'+f1(x)+'" cy="'+f1(y)+'" r="7.4"/>'+glyph('cross',x,y,extra);
  if(kind==='dot') return '<circle class="e-dot" cx="'+f1(x)+'" cy="'+f1(y)+'" r="3.6"'+(extra||'')+'/>';
  const a=3.4;
  return '<path class="e-cross" d="M'+f1(x-a)+' '+f1(y-a)+'L'+f1(x+a)+' '+f1(y+a)+'M'+f1(x-a)+' '+f1(y+a)+'L'+f1(x+a)+' '+f1(y-a)+'"'+(extra||'')+'/>';
}
function legendHTML(sc){
  return (sc.legend||[]).map(l=>'<span><svg width="14" height="14" viewBox="-7 -7 14 14">'+glyph(l.t,0,0)+'</svg> '+l.txt+'</span>').join('');
}
/* o: {user:[0|1|2], pre:[bool], bad:[idx], hinted:[idx], interactive:bool, label:str} */
function drawScene(sc,o){
  o=o||{};
  const user=o.user||[], pre=o.pre||[], bad=new Set(o.bad||[]), hinted=new Set(o.hinted||[]);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const grow=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  sc.circles.forEach(c=>{ const e=c.ion?10:0; grow(c.x-c.R-e,c.y-c.R-e); grow(c.x+c.R+(c.ion?32:e),c.y+c.R+e); });
  sc.arrows.forEach(a=>grow(Math.min(a.x1,a.x2),Math.min(a.y1,a.y2)-44));
  const P=16; x0-=P; y0-=P; x1+=P; y1+=P;
  const w=x1-x0,h=y1-y0;
  let s='<svg viewBox="'+f1(x0)+' '+f1(y0)+' '+f1(w)+' '+f1(h)+'" style="width:min(100%,'+Math.round(w*1.9)+'px)" role="img" aria-label="'+(o.label||'Dot-and-cross diagram')+'">';
  s+='<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="var(--ink2)"/></marker></defs>';
  if(sc.sea){ const lx0=Math.min(...sc.circles.map(c=>c.x-c.R))-14, lx1=Math.max(...sc.circles.map(c=>c.x+c.R))+14, ly0=Math.min(...sc.circles.map(c=>c.y-c.R))-14, ly1=Math.max(...sc.circles.map(c=>c.y+c.R))+14;
    s+='<rect class="sea" x="'+f1(lx0)+'" y="'+f1(ly0)+'" width="'+f1(lx1-lx0)+'" height="'+f1(ly1-ly0)+'" rx="26"/>'; }
  sc.circles.forEach(c=>{
    s+='<circle class="shell'+(c.ion?' ion':'')+'" cx="'+f1(c.x)+'" cy="'+f1(c.y)+'" r="'+c.R+'"'+(c.metal?' style="fill:var(--panel)"':'')+'/>';
  });
  sc.ions.forEach(c=>{
    const a=c.x-c.R-7,b=c.x+c.R+7,t=c.y-c.R-7,u=c.y+c.R+7;
    s+='<path class="brk" d="M'+f1(a+7)+' '+f1(t)+'H'+f1(a)+'V'+f1(u)+'H'+f1(a+7)+'M'+f1(b-7)+' '+f1(t)+'H'+f1(b)+'V'+f1(u)+'H'+f1(b-7)+'"/>';
    s+='<text class="chg" x="'+f1(b+4)+'" y="'+f1(t+6)+'">'+c.charge+'</text>';
  });
  sc.circles.forEach(c=>{
    if(c.charge) s+='<text class="sym sm" x="'+f1(c.x)+'" y="'+f1(c.y)+'">'+c.label+'<tspan dy="-5" font-size="10">'+c.charge+'</tspan></text>';
    else s+='<text class="sym'+(c.small?' sm':'')+'" x="'+f1(c.x)+'" y="'+f1(c.y)+'">'+c.label+'</text>';
  });
  sc.arrows.forEach(a=>{
    const mx=(a.x1+a.x2)/2, my=Math.min(a.y1,a.y2)-34;
    s+='<path class="arrow" marker-end="url(#ah)" d="M'+f1(a.x1)+' '+f1(a.y1-5)+'Q'+f1(mx)+' '+f1(my)+' '+f1(a.x2)+' '+f1(a.y2-5)+'"/>';
  });
  sc.slots.forEach((sl,i)=>{
    if(sl.target){ s+='<circle class="ring target" cx="'+f1(sl.x)+'" cy="'+f1(sl.y)+'" r="5.2"/>'; return; }
    if(sl.fixed){
      const ex=sl.drift!=null?' style="animation-delay:-'+((sl.drift*0.37)%3.2).toFixed(2)+'s"':'';
      s+=(sl.drift!=null?'<g class="drift"'+ex+'>':'')+glyph(sl.expect,sl.x,sl.y)+(sl.drift!=null?'</g>':'');
      return;
    }
    const code=pre[i]?(sl.expect==='dot'?1:2):(user[i]||0);
    if(code===0){
      s+='<circle class="ring'+(bad.has(i)?' bad':'')+(hinted.has(i)?' hinted':'')+'" cx="'+f1(sl.x)+'" cy="'+f1(sl.y)+'" r="5.4"/>';
    } else {
      s+=glyph(code===1?'dot':'cross',sl.x,sl.y);
      if(bad.has(i)) s+='<circle class="ring bad" cx="'+f1(sl.x)+'" cy="'+f1(sl.y)+'" r="6.6"/>';
      else if(hinted.has(i)) s+='<circle class="ring hinted" cx="'+f1(sl.x)+'" cy="'+f1(sl.y)+'" r="6.6"/>';
    }
    if(o.interactive && !pre[i]) s+='<circle class="hit" data-i="'+i+'" cx="'+f1(sl.x)+'" cy="'+f1(sl.y)+'" r="9" tabindex="0" role="button" aria-label="Electron position '+(i+1)+'"/>';
  });
  return s+'</svg>';
}
/* ---------- State ---------- */
const $=id=>document.getElementById(id);
const MODES={
  worked:{label:'Worked',lvl:0,blurb:'Watch each step worked out while the diagram builds. Nothing to fill in.'},
  guided:{label:'Guided',lvl:1,blurb:'A few blanks with hints on every step. The diagram is mostly drawn and you fill the gaps.'},
  practice:{label:'Practice',lvl:2,blurb:'More blanks. Hints are there if you get stuck, and you can peek at the separate atoms.'},
  challenge:{label:'Challenge',lvl:3,blurb:'Everything is blank, even the formula. No hints and no peeking. Scored on first tries.'}
};
const BLANK={worked:[],guided:['ion','ratio','need','lone'],practice:['ve','xf','ion','ratio','need','bond','lone'],challenge:['ve','xf','ion','ratio','need','bond','lone','formula']};
const PRE={worked:1,guided:.6,practice:.25,challenge:0};
const CH=[['','Choose…'],['1+','+'],['2+','2+'],['3+','3+'],['1-','−'],['2-','2−'],['3-','3−']];
const TYPES=[['ionic','Ionic bonding'],['covalent','Covalent bonding'],['metallic','Metallic bonding']];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let mode='guided', tab='list', custom={e1:'Na',e2:'Cl'}, customMsg='', P=null, G=null, STEPS=[];

function rng(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} let a=h>>>0;
  return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }
const norm=s=>String(s).replace(/\s+/g,'').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-0x2080));
const ionCfg=e=>EL[e].cfg.split(',').slice(0,-1).join(',');
const anCfg=e=>{const p=EL[e].cfg.split(',');p[p.length-1]='8';return p.join(',');};
const chLabel=v=>(CH.find(c=>c[0]===v)||[0,''])[1];

/* ---------- Step definitions ---------- */
function stepsFor(P){
  const L=[], els=P.els;
  const numF=(id,label,answer,suffix)=>({id,label,kind:'num',answer,suffix});
  L.push({id:'type',title:'Decide the type of bonding',
    q:'Which type of bonding holds <b>'+P.name+'</b> together? Elements involved: '+els.map(e=>'<b>'+e+'</b> ('+EL[e].n+')').join(', ')+'.',
    fields:[{id:'type',kind:'choice',answer:P.type}],
    hints:['Is each element a metal or a non-metal? Metals sit on the left and in the middle of the periodic table.','Metal + non-metal: electrons move across. Non-metals only: electrons are shared. A metal on its own: electrons are pooled.'],
    explain:()=>P.type==='ionic'?'<p><b>'+P.M+'</b> is a <b>metal</b> and <b>'+P.X+'</b> is a <b>non-metal</b>. The metal gives electrons to the non-metal, so the particles become oppositely charged ions: <b>ionic bonding</b>.</p>'
      :P.type==='covalent'?'<p>Every atom here is a <b>non-metal</b> ('+els.join(', ')+'). Non-metal atoms share pairs of electrons: <b>covalent bonding</b>.</p>'
      :'<p><b>'+P.name+'</b> is a <b>metal</b> on its own, so there is no non-metal to take its electrons. The atoms pool their outer electrons: <b>metallic bonding</b>.</p>'});
  L.push({id:'ve',title:'Count the outer electrons',q:'How many electrons are in the outer shell of each atom?',
    fields:els.map(e=>numF('ve_'+e,e+' atom',EL[e].ve,'outer-shell electron(s)')),
    hints:['Use the group number, or the last number in the electronic structure.','Electronic structures: '+els.map(e=>e+' = <code>'+EL[e].cfg+'</code>').join(', ')+'.'],
    explain:()=>els.map(e=>'<p><b>'+e+'</b>: electronic structure <code>'+EL[e].cfg+'</code>, so <b>'+EL[e].ve+'</b> outer electron'+(EL[e].ve>1?'s':'')+'.</p>').join('')});
  if(P.type==='ionic'){
    const {M,X,cm,an,a,b}=P;
    L.push({id:'xf',title:'Move the electrons',q:'Each atom changes until its outer shell is full. How many electrons does each one lose or gain?',
      fields:[numF('xf_m',M+' atom loses',cm,'electron(s)'),numF('xf_n',X+' atom gains',an,'electron(s)')],
      hints:['Metals lose electrons and non-metals gain them, until the outer shell is full.','Take the metal’s outer electrons away, or add enough to the non-metal to reach 8.'],
      explain:()=>'<p><b>'+M+'</b> loses '+cm+': <code>'+EL[M].cfg+'</code> → <code>'+ionCfg(M)+'</code>, a full shell.</p><p><b>'+X+'</b> gains '+an+': <code>'+EL[X].cfg+'</code> → <code>'+anCfg(X)+'</code>, a full shell.</p>'});
    L.push({id:'ion',title:'Write the ion charges',q:'What charge does each ion have?',
      fields:[{id:'ch_m',label:M+' ion',kind:'sel',answer:cm+'+'},{id:'ch_n',label:X+' ion',kind:'sel',answer:an+'-'}],
      hints:['Losing electrons leaves more protons than electrons, so the ion is positive. Gaining makes it negative.','The size of the charge is the number of electrons lost or gained.'],
      explain:()=>'<p><b>'+M+'</b>: '+EL[M].z+' protons, '+(EL[M].z-cm)+' electrons → <b>'+chargeText(cm,'+')+'</b>.</p><p><b>'+X+'</b>: '+EL[X].z+' protons, '+(EL[X].z+an)+' electrons → <b>'+chargeText(an,'-')+'</b>.</p>'});
    L.push({id:'ratio',title:'Balance the charges',q:'How many of each ion are needed so the total positive and negative charges cancel?',
      fields:[numF('n_m','number of '+M+' ions',a,''),numF('n_x','number of '+X+' ions',b,'')],
      hints:['Total positive charge must equal total negative charge.','Find numbers so that (number of '+M+' ions × '+cm+') = (number of '+X+' ions × '+an+').'],
      explain:()=>'<p>'+a+' × ('+chargeText(cm,'+')+') = '+a*cm+'+ and '+b+' × ('+chargeText(an,'-')+') = '+b*an+'−. The charges cancel, so the ratio is <b>'+a+' : '+b+'</b>.</p><p>Formula: <b>'+P.html+'</b></p>'});
  } else if(P.type==='covalent'){
    const sc=covScene(P,'final'); P._sc=sc;
    const full=e=>e==='H'?2:8;
    L.push({id:'need',title:'Work out the bonds each atom forms',q:'How many more electrons does each atom need for a full outer shell? That is also how many bonds it forms.',
      fields:els.map(e=>numF('nd_'+e,e+' needs',full(e)-EL[e].ve,'more electron(s)')),
      hints:['A full outer shell has 8 electrons. Hydrogen only needs 2.','Subtract the outer electrons from the full shell.'],
      explain:()=>els.map(e=>'<p><b>'+e+'</b>: '+EL[e].ve+' outer electron'+(EL[e].ve>1?'s':'')+', full shell '+full(e)+' → needs <b>'+(full(e)-EL[e].ve)+'</b> → forms '+(full(e)-EL[e].ve)+' bond'+((full(e)-EL[e].ve)>1?'s':'')+'.</p>').join('')});
    const kinds=[]; sc.bonds.forEach(bd=>{ const A=sc.atoms[bd.a].sym,B=sc.atoms[bd.b].sym; const k=[A,B].sort().join('-'); if(!kinds.find(x=>x.k===k)) kinds.push({k,A,B,order:bd.order}); });
    const W=['','single','double','triple'];
    L.push({id:'bond',title:'Count the shared pairs',q:'How many pairs of electrons are shared in each type of bond?',
      fields:kinds.map(k=>numF('bd_'+k.k,'each '+k.A+'–'+k.B+' bond',k.order,'shared pair(s)')),
      hints:['Each atom must share enough electrons to fill its outer shell.','One shared pair is a single bond, two is a double bond, three is a triple bond.'],
      explain:()=>kinds.map(k=>'<p><b>'+k.A+'–'+k.B+'</b>: '+k.order+' shared pair'+(k.order>1?'s':'')+' → a '+W[k.order]+' bond.</p>').join('')});
    const lone=els.map(e=>sc.atoms.find(a=>a.sym===e));
    L.push({id:'lone',title:'Find the lone pairs',q:'How many lone pairs (pairs not used in bonding) does each atom have?',
      fields:lone.map(a=>numF('lp_'+a.sym,a.sym+' atom',a.lone,'lone pair(s)')),
      hints:['Outer electrons minus the electrons used in bonds. Pairs of what is left are lone pairs.','Lone pairs = (outer electrons − electrons used in bonds) ÷ 2.'],
      explain:()=>lone.map(a=>'<p><b>'+a.sym+'</b>: '+EL[a.sym].ve+' outer − '+a.bondSum+' in bonds = '+(EL[a.sym].ve-a.bondSum)+' left → <b>'+a.lone+'</b> lone pair'+(a.lone!==1?'s':'')+'.</p>').join('')});
  } else {
    const M=P.M, v=EL[M].ve;
    L.push({id:'ion',title:'Find the ion charge',q:'The atoms release their outer electrons into the structure. What charge is left on each metal ion?',
      fields:[{id:'ch_m',label:M+' ion',kind:'sel',answer:v+'+'}],
      hints:['Each atom gives up its outer electrons, so what is left is positive.','The charge equals the number of electrons released.'],
      explain:()=>'<p><b>'+M+'</b> releases '+v+' electron'+(v>1?'s':'')+', so each ion is <b>'+chargeText(v,'+')+'</b>.</p>'});
  }
  L.push({id:'formula',title:'Write the formula',q:'Write the formula for <b>'+P.name+'</b>.',
    fields:[{id:'formula',label:'Formula',kind:'text',answer:P.plain}],
    hints:[P.type==='ionic'?'Metal first, then non-metal. Put the ratio as small numbers after each symbol. No charges.':'Count the atoms of each element in one molecule and write the numbers after the symbols.','A 1 is never written.'],
    explain:()=>'<p><b>'+P.html+'</b></p>',only:'challenge'});
  return L.filter(s=>!s.only||s.only===mode);
}
const diagExplain=()=>P.type==='ionic'?'<p>Draw each ion in square brackets with its charge. Metal electrons are crosses, the non-metal’s own electrons are dots, and the electrons it gained show as crosses. Every ion ends with a full outer shell.</p>'
  :P.type==='covalent'?'<p>Draw the shared pairs where the shells overlap, one dot and one cross in each pair. Then add the lone pairs on the outside. Every atom ends with a full outer shell.</p>'
  :'<p>Draw a regular lattice of positive ions. The outer electrons are delocalised, so they move freely through the whole structure.</p>';
const propsText=()=>P.type==='ionic'?'<b>Why it matters:</b> strong attraction between oppositely charged ions in a giant lattice, so a high melting point. It conducts electricity only when molten or dissolved, because the ions are then free to move.'
  :P.type==='covalent'?'<b>Why it matters:</b> strong covalent bonds inside each molecule but weak forces between molecules, so a low melting and boiling point. It does not conduct electricity because there are no free charged particles.'
  :'<b>Why it matters:</b> the delocalised electrons carry charge, so metals conduct electricity. The layers of ions slide over each other, so metals are malleable.';

/* ---------- Problem lifecycle ---------- */
const isBlank=id=>mode!=='worked'&&(id==='type'||BLANK[mode].includes(id));
function setProblem(p){
  P=p; STEPS=stepsFor(P);
  G={ss:{},fv:{},fs:{},hint:{},wrong:{},typeDone:mode==='worked',widx:0,finished:false,dg:null};
  initDiag(); renderAll();
}
function initDiag(){
  const dg={user:[],pre:[],bad:[],hinted:[],msg:'',msgOk:false,hint:0,attempts:0,helped:false,first:false,done:false,peek:false,n:0,view:'dc',lone:false,orders:[],lres:null,lok:false,lmsg:''};
  if(P.type==='covalent') dg.orders=covScene(P,'atoms').bonds.map(()=>1);
  if(P.type!=='metallic'){
    const sc=P.type==='ionic'?ionScene(P,'final'):covScene(P,'final');
    const N=sc.slots.length;
    if(mode==='worked'){ dg.pre=sc.slots.map(()=>true); }
    else {
      const r=rng(P.plain+mode), idx=sc.slots.map((_,i)=>i).sort(()=>r()-.5);
      const k=Math.min(Math.round(N*PRE[mode]),N-1);
      dg.pre=sc.slots.map(()=>false); idx.slice(0,k).forEach(i=>dg.pre[i]=true);
    }
    dg.user=sc.slots.map((s,i)=>dg.pre[i]?(s.expect==='dot'?1:2):0);
  } else if(mode==='worked'){ dg.n=EL[P.M].ve; }
  G.dg=dg;
}
function tasks(){ const ids=STEPS.filter(s=>isBlank(s.id)).map(s=>s.id); return ids.concat(['diagram']); }
function doneCount(){ return tasks().filter(id=>id==='diagram'?G.dg.done:(G.ss[id]||{}).done).length; }
function firstCount(){ return tasks().filter(id=>id==='diagram'?G.dg.first:(G.ss[id]||{}).first).length; }
function cmp(f,v){ if(f.kind==='num') return v!==''&&parseInt(v,10)===f.answer; if(f.kind==='text') return norm(v)===norm(f.answer); return v===f.answer; }
const ssOf=id=>G.ss[id]||(G.ss[id]={attempts:0,helped:false,done:false,first:false,msg:''});

/* ---------- Rendering: header, modes, picker ---------- */

    +[1,2,3].map(i=>'<i class="'+(i<=MODES[k].lvl?'on':'')+'"></i>').join('')+'</span></button>').join('');

function renderPicker(){

  else h+='<div class="builder"><label>Element 1<select id="e1">'+opt(custom.e1,false)+'</select></label><label>Element 2<select id="e2">'+opt(custom.e2,true)+'</select></label></div><p class="note'+(customMsg?' err':'')+'">'+(customMsg||'Pick two elements and the lab works out the substance. Choose a metal alone for a metal, or the same non-metal twice for a diatomic molecule.')+'</p>';
  $('picker').innerHTML=h;

/* ---------- Rendering: steps ---------- */
function fieldHTML(f,st,state){ // state: 'open' | 'locked' | 'done' | 'given'
  const v=G.fv[f.id]??'', s=G.fs[f.id]||'';
  if(f.kind==='choice'){
    return '<div class="choices">'+TYPES.map(t=>'<button class="choice'+(state==='done'&&t[0]===f.answer?' ok':'')+(G.wrong[t[0]]&&state!=='done'?' bad':'')+'" data-act="choose" data-val="'+t[0]+'"'+(state!=='open'?' disabled':'')+'>'+t[1]+'</button>').join('')+'</div>';
  }
  if(state==='given'||state==='done'&&false){ const lab=f.kind==='sel'?chLabel(f.answer):f.answer; return '<div class="fld"><span>'+f.label+'</span><span class="given">'+lab+'</span><em>'+(f.suffix||'')+'</em></div>'; }
  const dis=state!=='open'?' disabled':'';

  if(f.kind==='sel') ctl='<select id="f_'+f.id+'" data-f="'+f.id+'" class="'+s+'"'+dis+'>'+CH.map(c=>'<option value="'+c[0]+'"'+(v===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')+'</select>';
  else if(f.kind==='text') ctl='<input type="text" id="f_'+f.id+'" data-f="'+f.id+'" class="'+s+'" value="'+String(v).replace(/"/g,'&quot;')+'" autocomplete="off" spellcheck="false"'+dis+'>';
  else ctl='<input type="number" id="f_'+f.id+'" data-f="'+f.id+'" class="'+s+'" min="0" max="9" value="'+v+'"'+dis+'>';
  return '<div class="fld"><span>'+f.label+'</span>'+ctl+'<em>'+(f.suffix||'')+'</em></div>';

function stepCard(st,n){
  const blank=isBlank(st.id), ss=ssOf(st.id), locked=st.id!=='type'&&!G.typeDone;
  const state=!blank?'given':ss.done?'done':locked?'locked':'open';
  const pill=state==='given'?'<span class="pill">Given</span>':state==='done'?'<span class="pill ok">Done</span>':state==='locked'?'<span class="pill">Locked</span>':'';
  let h='<section class="card step '+(state==='done'||state==='given'?'done':'')+(state==='locked'?' locked':'')+'" data-step="'+st.id+'"><header><span class="tag">'+n+'</span><h3>'+st.title+'</h3>'+pill+'</header>';
  h+='<p class="q">'+st.q+'</p><div class="fields">'+st.fields.map(f=>fieldHTML(f,st,state)).join('')+'</div>';
  if(state==='open'||state==='locked'){
    const hb=mode!=='challenge';
    h+='<div class="actions">'+(st.id==='type'?'':'<button class="btn" data-act="check" data-step="'+st.id+'"'+(state==='locked'?' disabled':'')+'>Check</button>')
      +(hb?'<button class="btn ghost" data-act="hint" data-step="'+st.id+'"'+(state==='locked'?' disabled':'')+'>Hint</button><button class="btn ghost" data-act="reveal" data-step="'+st.id+'"'+(state==='locked'?' disabled':'')+'>Show answer</button>':'')+'</div>';
    if(ss.msg&&state==='open') h+='<p class="msg bad">'+ss.msg+'</p>';
    const hn=G.hint[st.id]||0; if(hn>0&&state==='open') h+='<div class="hintbox">'+st.hints.slice(0,hn).join('<br>')+'</div>';
  }
  if(state==='done'||state==='given'){
    h+='<div class="explain">'+st.explain()+'</div>';
  }
  return h+'</section>';
}
function renderSteps(){
  let h='';
  const name=P.name;
  const tot=tasks().length, dn=doneCount();
  h+='<div class="card"><div class="probhead"><h2>'+cap(name)+'</h2><span class="f">'+(mode==='challenge'&&P.type!=='metallic'?'?':P.html)+'</span></div>';
  if(mode!=='worked') h+='<div class="progress">'+dn+' of '+tot+' tasks complete</div><div class="bar"><i style="width:'+Math.round(dn/tot*100)+'%"></i></div>';
  else h+='<div class="progress">Step '+(G.widx+1)+' of '+(STEPS.length+1)+'</div>';
  h+='</div>';
  if(mode==='worked'){
    const last=G.widx>=STEPS.length;
    if(!last){ const st=STEPS[G.widx]; h+=workedCard(st,G.widx+1); }
    else h+='<section class="card step"><header><span class="tag">'+(STEPS.length+1)+'</span><h3>Draw the dot-and-cross diagram</h3></header><div class="explain">'+diagExplain()+'</div><div class="props">'+propsText()+'</div>'+stepperHTML()+'</section>';
  } else {
    let n=1; h+=STEPS.map(st=>stepCard(st,n++)).join('');
    if(G.finished){
      const f=firstCount(), t=tasks().length;
      h+='<section class="card done-card"><h3>Done. '+f+' of '+t+' right first time.</h3><p>'+(f===t?'Clean sheet. Try a harder mode or a new substance.':'Every task is complete. Try the same one again in a harder mode, or pick something new.')+'</p><div class="actions"><button class="btn" data-act="random">Another substance</button><button class="btn ghost" data-act="retry">Try this one again</button></div></section>';
    }
  }
  $('steps').innerHTML=h;
}
function workedCard(st,n){
  const rows=st.fields.map(f=>f.kind==='choice'?'':fieldHTML(f,st,'given')).join('');
  const ans=st.id==='type'?'<div class="choices">'+TYPES.map(t=>'<button class="choice'+(t[0]===P.type?' ok':'')+'" disabled>'+t[1]+'</button>').join('')+'</div>':'';
  return '<section class="card step"><header><span class="tag">'+n+'</span><h3>'+st.title+'</h3></header><p class="q">'+st.q+'</p>'+(rows?'<div class="fields">'+rows+'</div>':'')+ans+'<div class="explain">'+st.explain()+'</div>'+stepperHTML()+'</section>';
}
function stepperHTML(){
  const tot=STEPS.length+1;
  return '<div class="stepper"><button class="btn ghost" data-act="wprev"'+(G.widx===0?' disabled':'')+'>Back</button><span class="dots">'+Array.from({length:tot},(_,i)=>'<i class="'+(i<=G.widx?'on':'')+'"></i>').join('')+'</span><button class="btn" data-act="wnext"'+(G.widx>=tot-1?' disabled':'')+'>Next step</button></div>';
}

/* ---------- Rendering: diagram panel ---------- */
function renderDiag(){
  const dg=G.dg; let h='<div class="dh"><h3>Dot-and-cross diagram</h3></div>';
  if(P.type==='covalent'&&mode!=='challenge'&&(mode==='worked'||G.typeDone)){ h+=viewTabs(dg); if(dg.view==='lines'){ $('diag').innerHTML=h+linesPanel(); return; } }
  const mk=(sc,o)=>'<div class="canvas">'+drawScene(sc,o)+'</div>';
  if(mode==='worked'){
    const last=G.widx>=STEPS.length;
    let sc,cap;
    if(P.type==='metallic'){ sc=metScene(P,last?EL[P.M].ve:0,last?'final':'atoms'); cap=last?'After: positive ions in a sea of delocalised electrons':'Before: separate metal atoms'; }
    else if(last){ sc=P.type==='ionic'?ionScene(P,'final'):covScene(P,'final'); cap='After bonding'; }
    else { sc=P.type==='ionic'?ionScene(P,'atoms'):covScene(P,'atoms'); cap='Before bonding: separate atoms'+(P.type==='ionic'?' (arrows show electron transfer)':''); }
    h+=mk(sc,{pre:last?dg.pre:[],user:dg.user,label:cap})+'<div class="legend"><b>'+cap+'.</b></div><div class="legend">'+legendHTML(sc)+'</div>';
    $('diag').innerHTML=h; return;
  }
  if(!G.typeDone){
    h+='<div class="canvas"><p class="lock"><b>Locked.</b><br>Decide the type of bonding in step 1 and the diagram opens up for you to draw.</p></div>';
    $('diag').innerHTML=h; return;
  }
  let sc;
  if(dg.peek){ sc=P.type==='metallic'?metScene(P,0,'atoms'):P.type==='ionic'?ionScene(P,'atoms'):covScene(P,'atoms'); h+=mk(sc,{label:'Atoms before bonding'})+'<div class="legend"><b>Atoms before bonding.</b> Arrows show where electrons go.</div><div class="legend">'+legendHTML(sc)+'</div>'; }
  else if(P.type==='metallic'){
    sc=metScene(P,dg.n,'final');
    h+=mk(sc,{label:'Metallic lattice'})+'<div class="counter"><span>Electrons released per atom</span><button data-act="nminus"'+(dg.done?' disabled':'')+' aria-label="Fewer electrons">−</button><output>'+dg.n+'</output><button data-act="nplus" aria-label="More electrons">+</button></div><div class="legend">'+legendHTML(sc)+'</div>';
  } else {
    sc=P.type==='ionic'?ionScene(P,'final'):covScene(P,'final');
    h+=mk(sc,{user:dg.user,pre:dg.pre,bad:dg.bad,hinted:dg.hinted,interactive:!dg.done,label:'Dot-and-cross diagram of '+P.name});
    h+='<p class="note">Click a ring once for a dot, twice for a cross, a third time to clear it. Position does not matter: each ion or shared pair just needs the right dots and crosses.</p><div class="legend">'+legendHTML(sc)+'</div>';
  }
  const hb=mode!=='challenge';
  h+='<div class="actions" style="margin-top:12px">'+(dg.done?'':'<button class="btn" data-act="dcheck">Check diagram</button>')
    +(hb&&!dg.done?'<button class="btn ghost" data-act="dhint">Hint</button><button class="btn ghost" data-act="dreveal">Show answer</button>':'')
    +(P.type!=='metallic'&&!dg.done?'<button class="btn ghost" data-act="dclear">Clear</button>':'')
    +(hb&&mode!=='worked'?'<button class="btn ghost" data-act="dpeek">'+(dg.peek?'Back to my diagram':'Peek at the atoms')+'</button>':'')+'</div>';
  if(dg.msg) h+='<p class="msg '+(dg.msgOk?'ok':'bad')+'">'+dg.msg+'</p>';
  const DH={ionic:['Metal electrons are crosses. They move across to the non-metal.','Each ion should show 8 electrons in its outer shell (lithium shows 2). The non-metal’s own electrons are dots.'],
    covalent:['Start with the shared pairs where the shells overlap: each pair has one dot and one cross.','Then add the lone pairs on the outside. Every atom should finish with 8 electrons around it (hydrogen 2).'],
    metallic:['Count the outer electrons one atom can release.','Each atom releases all of its outer electrons. Use + until that many are in the sea.']}[P.type];
  if(dg.hint>0&&!dg.done) h+='<div class="hintbox">'+DH.slice(0,Math.min(dg.hint,2)).join('<br>')+'</div>';
  if(dg.done) h+='<div class="explain">'+diagExplain()+'</div><div class="props">'+propsText()+'</div>';
  $('diag').innerHTML=h;
}

/* ---------- Actions ---------- */
function checkStep(id){
  const st=STEPS.find(s=>s.id===id), ss=ssOf(id); let all=true;
  st.fields.forEach(f=>{ const v=String(G.fv[f.id]??'').trim(); const ok=cmp(f,v); G.fs[f.id]=ok?'ok':'bad'; if(!ok) all=false; });
  ss.attempts++;
  if(all){ ss.done=true; ss.msg=''; ss.first=ss.attempts===1&&!ss.helped; }
  else ss.msg='Not quite. The red boxes need another look.';
  afterChange();
}
function revealStep(id){
  const st=STEPS.find(s=>s.id===id), ss=ssOf(id);
  st.fields.forEach(f=>{ G.fv[f.id]=String(f.answer); G.fs[f.id]='ok'; });
  ss.done=true; ss.helped=true; ss.first=false; ss.msg='';
  if(id==='type') G.typeDone=true;
  afterChange();
}
function dgEval(sc){
  const dg=G.dg, groups={}, bad=[];
  sc.slots.forEach((s,i)=>{ (groups[s.g]=groups[s.g]||[]).push(i); });
  Object.values(groups).forEach(ix=>{
    let ed=0,ec=0,ud=0,uc=0;
    ix.forEach(i=>{ if(sc.slots[i].expect==='dot') ed++; else ec++; if(dg.user[i]===1) ud++; else if(dg.user[i]===2) uc++; });
    if(ud===ed&&uc===ec) return;
    let sd=Math.max(0,ud-ed), sx=Math.max(0,uc-ec);
    ix.forEach(i=>{ const u=dg.user[i]; if(u===0) bad.push(i); else if(u===1&&sd>0){sd--;bad.push(i);} else if(u===2&&sx>0){sx--;bad.push(i);} });
  });
  return {bad,groups};
}
function dgCheck(){
  const dg=G.dg; dg.attempts++;
  if(P.type==='metallic'){
    const ok=dg.n===EL[P.M].ve; dg.done=ok; if(ok){dg.first=dg.attempts===1&&!dg.helped; dg.msg='';}
    else dg.msg=dg.n===0?'No electrons in the sea yet. Add the outer electrons each atom releases.':(dg.n<EL[P.M].ve?'Not enough electrons. Each atom releases all of its outer electrons.':'Too many electrons. An atom can only release the electrons in its outer shell.');
    return afterChange();
  }
  const sc=P.type==='ionic'?ionScene(P,'final'):covScene(P,'final');
  dg.hinted=[]; dg.bad=dgEval(sc).bad; const good=sc.slots.length-dg.bad.length;
  if(!dg.bad.length){ dg.done=true; dg.first=dg.attempts===1&&!dg.helped; dg.msg=''; }
  else { dg.msgOk=false; dg.msg=good+' of '+sc.slots.length+' electrons are right. The red rings are empty or hold too many of that symbol.'; }
  afterChange();
}
function dgReveal(){
  const dg=G.dg; dg.helped=true; dg.first=false; dg.done=true; dg.msg=''; dg.bad=[]; dg.hinted=[];
  if(P.type==='metallic') dg.n=EL[P.M].ve;
  else { const sc=P.type==='ionic'?ionScene(P,'final'):covScene(P,'final'); dg.user=sc.slots.map(s=>s.expect==='dot'?1:2); }
  afterChange();
}
function dgHint(){
  const dg=G.dg; dg.helped=true; dg.first=false;
  if(dg.hint<2||P.type==='metallic'){ dg.hint=Math.min(dg.hint+1,2); return renderDiag(); }
  const sc=P.type==='ionic'?ionScene(P,'final'):covScene(P,'final');
  const i=dgEval(sc).bad[0];
  if(i!=null){ const ix=sc.slots.map((s,k)=>k).filter(k=>sc.slots[k].g===sc.slots[i].g); const ed=ix.filter(k=>sc.slots[k].expect==='dot').length, ud=ix.filter(k=>dg.user[k]===1).length; dg.user[i]=ed>ud?1:2; dg.hinted.push(i); dg.bad=dg.bad.filter(x=>x!==i); dg.msg='One electron placed for you (amber ring).'; dg.msgOk=true; }
  renderDiag();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-mode],[data-tab],[data-i],[data-act]'); if(!t) return;
  if(t.dataset.mode){ mode=t.dataset.mode; setProblem(P); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; renderPicker(); if(tab==='build') applyCustom(); return; }
  if(t.classList.contains('chip')){ setProblem(LIST[+t.dataset.i]); return; }
  if(t.classList.contains('hit')){ slotClick(+t.dataset.i); return; }
  const a=t.dataset.act, id=t.dataset.step;
  if(a==='random'){ let p; do{p=LIST[Math.floor(Math.random()*LIST.length)];}while(P&&p.plain===P.plain&&p.type===P.type); tab='list'; setProblem(p); }
  else if(a==='retry') setProblem(P);
  else if(a==='choose'){ const ss=ssOf('type'); ss.attempts++; if(t.dataset.val===P.type){ ss.done=true; ss.first=ss.attempts===1&&!ss.helped; G.typeDone=true; G.wrong={}; } else G.wrong[t.dataset.val]=true; afterChange(); }
  else if(a==='check') checkStep(id);
  else if(a==='hint'){ const st=STEPS.find(s=>s.id===id); G.hint[id]=Math.min((G.hint[id]||0)+1,st.hints.length); ssOf(id).helped=true; renderSteps(); }
  else if(a==='reveal') revealStep(id);
  else if(a==='wnext'){ G.widx=Math.min(G.widx+1,STEPS.length); renderSteps(); renderDiag(); }
  else if(a==='wprev'){ G.widx=Math.max(G.widx-1,0); renderSteps(); renderDiag(); }
  else if(a==='dcheck') dgCheck();
  else if(a==='dhint') dgHint();
  else if(a==='dreveal') dgReveal();
  else if(a==='dclear'){ G.dg.user=G.dg.user.map((v,i)=>G.dg.pre[i]?v:0); G.dg.bad=[]; G.dg.hinted=[]; G.dg.msg=''; renderDiag(); }
  else if(a==='dpeek'){ G.dg.peek=!G.dg.peek; renderDiag(); }
  else if(a==='nplus'){ G.dg.n=Math.min(G.dg.n+1,4); G.dg.msg=''; renderDiag(); }
  else if(a==='nminus'){ G.dg.n=Math.max(G.dg.n-1,0); G.dg.msg=''; renderDiag(); }
});

function drawIonic(shift){
  const s=62,cols=5,rows=4,ox=40,oy=38; let o='';
  const pos=(r,c)=>[ox+c*s+(shift&&r<2?s:0),oy+r*s];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const [x,y]=pos(r,c);
    if(c<cols-1){ const [x2,y2]=pos(r,c+1); o+='<line class="attr" x1="'+x+'" y1="'+y+'" x2="'+x2+'" y2="'+y2+'"/>'; }
    if(r<rows-1&&!(shift&&r===1)){ const [x2,y2]=pos(r+1,c); o+='<line class="attr" x1="'+x+'" y1="'+y+'" x2="'+x2+'" y2="'+y2+'"/>'; } }
  if(shift) for(let c=0;c<cols-1;c++){ const x=ox+(c+1)*s, y=oy+s, R=((1+c)%2===1)?15:21; o+='<line class="rep" x1="'+x+'" y1="'+(y+R+2)+'" x2="'+x+'" y2="'+(y+s-R-2)+'" marker-start="url(#ahr)" marker-end="url(#ahr)"/>'; }
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const [x,y]=pos(r,c); o+=ion(x,y,(r+c)%2===1); }
  const w=ox*2+(cols-1)*s+s, h=oy*2+(rows-1)*s;
  return SVG(w,h,o,'Giant ionic lattice');
}
function hexNet(cols,rows,a){
  const idx={},atoms=[],bonds=[],bset=new Set(),cent=[];
  const get=(x,y)=>{const k=Math.round(x*2)+','+Math.round(y*2); if(!(k in idx)){idx[k]=atoms.length;atoms.push({x,y,n:[]});} return idx[k];};
  for(let c=0;c<cols;c++) for(let r=0;r<rows;r++){
    const cx=c*1.5*a, cy=r*Math.sqrt(3)*a+(c%2)*Math.sqrt(3)*a/2; cent.push([cx,cy]);
    const v=[0,1,2,3,4,5].map(k=>get(cx+a*Math.cos(k*Math.PI/3),cy+a*Math.sin(k*Math.PI/3)));
    for(let k=0;k<6;k++){ const i=v[k],j=v[(k+1)%6],key=Math.min(i,j)+'-'+Math.max(i,j); if(!bset.has(key)){bset.add(key);bonds.push([i,j]);atoms[i].n.push(j);atoms[j].n.push(i);} }
  }
  return {atoms,bonds,cent};
}
function drawHex(cols,rows,a,label){
  const net=hexNet(cols,rows,a), ox=30,oy=30; let o='';

  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    let x=ox+c*dx+(r%2?dx/2:0), y=oy+r*dy; if(pushed&&r<2) x+=alloy?4:dx; const k=r+','+c;
    let R=14,cls='';
    if(alloy&&big.includes(k)){R=17;cls='cat';} else if(alloy&&small.includes(k)){R=9;cls='an';}
    o+='<circle class="gatom '+cls+'" cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+R+'"/>';

function mcq(topic,p,correct,wrongs,why){
  const w=shuffle([...new Set(wrongs)].filter(x=>x!==correct)).slice(0,3), o=shuffle([correct,...w]);

}

const GRAD=a=>a*Math.PI/180;
function gionScene(ion){

  const pairsAt=(x,y,R,angs,list,g)=>{ let k=0; angs.forEach(t=>{ [-dlt(R),dlt(R)].forEach(dd=>{ if(k<list.length){ const [px,py]=polar(x,y,R,t+dd); slots.push({x:px,y:py,expect:list[k],fixed:true}); } k++; }); }); };

    sp.outer.forEach(o=>atoms.push({s:o.s,x:(Rc+Ro(o)-8)*Math.cos(GRAD(o.ang)),y:(Rc+Ro(o)-8)*Math.sin(GRAD(o.ang)),R:Ro(o),t:'dot',ang:o.ang}));

      o.bonds.forEach((bt,k)=>{ const sft=(k-(n-1)/2)*14, qx=cx+px*sft, qy=cy+py*sft;
        slots.push({x:qx-ux*5,y:qy-uy*5,expect:bt[0],fixed:true}); slots.push({x:qx+ux*5,y:qy+uy*5,expect:bt[1],fixed:true});
        cUsed+=bt[0]==='cross'?1:0; cUsed+=bt[1]==='cross'?1:0; oUsed[i]+=bt[1]==='dot'?1:0; }); });
    const cList=[]; for(let i=0;i<sp.own-cUsed;i++) cList.push('cross');
    for(let i=0;i<(sp.gain||0);i++) cList.push('gain');
    if(cList.length){ let sx=0,sy=0; atoms.slice(1).forEach(a=>{ const d=Math.hypot(a.x,a.y); sx+=a.x/d; sy+=a.y/d; }); const phi=Math.hypot(sx,sy)<1e-6?270:Math.atan2(-sy,-sx)*180/Math.PI; pairsAt(0,0,Rc,lonePairAngles(cList.length/2,phi),cList); }

  }

}
function ionFig(ion,n){

  let svg=drawScene(sc,{label:'Electron diagram of the '+ion.name+' ion'});

function ionsRow(co){

/* ---------- Electron lab: drag the electrons ---------- */
const DL={q:true,tab:'ionic',lvl:'guided',idx:{ionic:0,covalent:0,metallic:0},S:null,sel:-1,msg:'',drag:null,anim:0};
const DLIST=()=>({ionic:LIST.filter(p=>p.type==='ionic'),covalent:LIST.filter(p=>p.type==='covalent'),metallic:LIST.filter(p=>p.type==='metallic')}[DL.tab]);
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ----- set up each kind of substance ----- */

/* ----- geometry helpers for covalent ----- */
function cvPos(S,i,t){ const a=S.at[i], e=easeIO(t); return [lerp(a.x0,a.x1,e),lerp(a.y0,a.y1,e)]; }
function cvBondPos(S,bi,k,side,t){
  const b=S.bonds[bi], A=cvPos(S,b.a,t), B=cvPos(S,b.b,t), dx=B[0]-A[0], dy=B[1]-A[1], d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d;
  const cl=(d-S.at[b.b].R+S.at[b.a].R)/2, s=(k-(b.order-1)/2)*14, qx=A[0]+ux*cl-uy*s, qy=A[1]+uy*cl+ux*s;
  return side===0?[qx-ux*5,qy-uy*5]:[qx+ux*5,qy+uy*5];
}
function cvTokPos(S,tk,t){

  const A=cvPos(S,tk.atom,t), o1=tk.off1||tk.off0, e=easeIO(t);
  return [A[0]+lerp(tk.off0[0],o1[0],e),A[1]+lerp(tk.off0[1],o1[1],e)];
}
function dlTokXY(S,tk){
  if(DL.tab==='covalent') return cvTokPos(S,tk,S.t);
  return [tk.x,tk.y];
}

/* ----- drawing ----- */
function fitSVG(svg,x0,y0,w,h,id){

}
function tokHTML(S,tk,live){

}
function dlSVG(){
  const S=DL.S, P=S.P, live=!S.done&&!S.anim&&S.gate;

/* ----- panels ----- */
function dlInfo(){

  if(!S.done&&!S.gate) return dlGateCard();
  if(DL.lvl==='free'&&DL.tab==='ionic') return dlFreeCard();
  const rem=S.tok.filter(k=>DL.tab==='ionic'?k.slot<0:DL.tab==='covalent'?!k.st:!k.sea).length;
  if(!S.done){
    if(DL.tab==='ionic'){
      const placed=S.tgt.filter(t=>t.f>=0).length;
      h+='<p class="q">Drag the outer-shell electrons (pink crosses) from the <b>'+EL[P.M].n+'</b> to the <b>'+EL[P.X].n+'</b> so every atom ends with a full outer shell.</p>'
        +(g?'<div class="progressline"><b>'+placed+' of '+S.tgt.length+'</b> electrons transferred. Each '+EL[P.X].n+' atom needs <b>'+P.an+'</b> more electron'+(P.an>1?'s':'')+'.</div>':'<p class="note">Work out how many electrons each atom must lose or gain.</p>');
    } else if(DL.tab==='covalent'){

      h+='<p class="q">Atoms share electrons so each one gets a full outer shell. Drag electrons into the gap between atoms to make <b>shared pairs</b>. Each atom gives one electron to every pair.</p>'

    } else {
      h+='<p class="q">In a metal the outer electrons leave their atoms and move freely. Drag every outer electron into the space <b>between</b> the atoms.</p>'
        +(g?'<div class="progressline"><b>'+(S.tok.length-rem)+' of '+S.tok.length+'</b> electrons delocalised. Each '+EL[P.M].n+' atom has '+EL[P.M].ve+' outer electron'+(EL[P.M].ve>1?'s':'')+'.</div>':'');
    }

  } else {
    if(DL.tab==='ionic') h+='<div class="explain"><p><b>Ions formed.</b> Each '+EL[P.M].n+' atom lost '+P.cm+' electron'+(P.cm>1?'s':'')+' and became <b>'+P.M+'<sup>'+chargeText(P.cm,'+')+'</sup></b>. Each '+EL[P.X].n+' atom gained '+P.an+' and became <b>'+P.X+'<sup>'+chargeText(P.an,'-')+'</sup></b>. Both now have a full outer shell.</p><p>The oppositely charged ions attract strongly. This electrostatic attraction is the <b>ionic bond</b>. Ratio of ions: '+P.a+' '+P.M+' : '+P.b+' '+P.X+', so the formula is <b>'+P.html+'</b>.</p></div>';

    else h+='<div class="explain"><p><b>Metallic bonding.</b> The atoms became positive ions, <b>'+P.M+'<sup>'+chargeText(EL[P.M].ve,'+')+'</sup></b>, in a regular lattice. The outer electrons are <b>delocalised</b>: they are free to move through the whole structure. The strong attraction between the positive ions and the sea of electrons is the <b>metallic bond</b>.</p></div>';

}
function renderDrag(){

/* ----- placing electrons ----- */
function dlSvgPt(e){ const svg=$('drsvg'), pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const q=pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x,q.y]; }
function dlTry(id,px,py){
  const S=DL.S, tk=S.tok[id], P=S.P; DL.msg='';
  if(DL.tab==='ionic'&&DL.lvl==='free'){
    if(tk.slot>=0){ S.tgt[tk.slot].f=-1; tk.slot=-1; }
    const v=S.view; if(v){ px=Math.min(v[0]+v[2]-10,Math.max(v[0]+10,px)); py=Math.min(v[1]+v[3]-10,Math.max(v[1]+10,py)); }
    tk.x=px; tk.y=py; S.chgres={}; return;
  }
  if(DL.tab==='ionic'){
    if(tk.slot>=0){ S.tgt[tk.slot].f=-1; tk.slot=-1; tk.x=tk.hx; tk.y=tk.hy; }
    let best=-1,bd=30; S.tgt.forEach((t,i)=>{ if(t.f<0){ const d=Math.hypot(t.x-px,t.y-py); if(d<bd){bd=d;best=i;} } });
    if(best>=0){ S.tgt[best].f=id; tk.slot=best; tk.x=S.tgt[best].x; tk.y=S.tgt[best].y; if(S.tgt.every(t=>t.f>=0)) dlFinish(); return; }
    const near=S.sc.circles.find(c=>Math.hypot(c.x-px,c.y-py)<c.R+16);
    if(near&&near.label===P.X) DL.msg='That atom\'s outer shell is already full, so it cannot take more electrons.';
    else if(near) DL.msg='Metal atoms lose electrons. Move it onto a non-metal atom that needs it.';
  } else if(DL.tab==='covalent'){
    if(tk.st){ S.bonds[tk.st.bi].pairs[tk.st.k][tk.st.side]=-1; tk.st=null; }
    let best=-1,bd=1e9; S.bonds.forEach((b,bi)=>{ const [ax,ay]=cvBondPos(S,bi,(b.order-1)/2,0,0),[bx,by]=cvBondPos(S,bi,(b.order-1)/2,1,0), cx=(ax+bx)/2, cy=(ay+by)/2, d=Math.hypot(cx-px,cy-py); if(d<24+9*b.order&&d<bd){bd=d;best=bi;} });
    if(best>=0){ const b=S.bonds[best];
      if(b.a!==tk.atom&&b.b!==tk.atom){ DL.msg='That bond is between '+S.at[b.a].sym+' and '+S.at[b.b].sym+'. Use an electron from one of those atoms.'; }
      else { const side=b.a===tk.atom?0:1, k=b.pairs.findIndex(p=>p[side]<0);
        if(k<0) DL.msg='This '+S.at[tk.atom].sym+' atom has already given enough electrons to this bond.';
        else { b.pairs[k][side]=id; tk.st={bi:best,k,side}; if(S.bonds.every(b=>b.pairs.every(p=>p[0]>=0&&p[1]>=0))) dlFinish(); } }
    }
  } else {
    if(tk.sea){ tk.sea=false; tk.x=tk.hx; tk.y=tk.hy; }
    const m=S.R+10, inside=px>-m&&px<(S.cols-1)*S.sp+m&&py>-m&&py<(S.rows-1)*S.sp+m, onAtom=S.atoms.some(a=>Math.hypot(a.x-px,a.y-py)<S.R+4);
    if(inside&&!onAtom){ tk.sea=true; tk.x=px; tk.y=py; if(S.tok.every(k=>k.sea)) dlFinish(); }
    else if(onAtom) DL.msg='Move it out of the atom, into the space between the atoms.';
  }
}
function dlFinish(){
  const S=DL.S; DL.sel=-1;
  if(DL.tab==='ionic'){ S.done=true; return; }
  if(DL.tab==='metallic'){ S.done=true; return; }
  S.at.forEach((a,i)=>{ const home=S.tok.filter(k=>k.atom===i&&!k.st), ls=S.F.slots.filter(s=>s.g==='l'+i); home.forEach((k,j)=>{ if(ls[j]) k.off1=[ls[j].x-a.x1,ls[j].y-a.y1]; }); });
  S.anim=1; const t0=performance.now();
  const step=now=>{ S.t=Math.min(1,(now-t0)/1100); dlPaint(); if(S.t<1) DL.anim=requestAnimationFrame(step); else { S.anim=0; S.done=true; dlPaint(); } };
  DL.anim=requestAnimationFrame(step);
}
function dlHelp(){
  const S=DL.S; DL.msg=''; if(!S.gate) return;
  if(DL.tab==='ionic'){ const k=S.tok.find(k=>k.slot<0), i=S.tgt.findIndex(t=>t.f<0); if(k&&i>=0){ dlTry(k.id,S.tgt[i].x,S.tgt[i].y); } }
  else if(DL.tab==='covalent'){ for(const [bi,b] of S.bonds.entries()){ for(let k=0;k<b.order;k++) for(const side of [0,1]){ if(b.pairs[k][side]<0){ const atom=side?b.b:b.a, tk=S.tok.find(t=>t.atom===atom&&!t.st); if(tk){ const [x,y]=cvBondPos(S,bi,k,side,0); dlTry(tk.id,x,y); return; } } } } }
  else { const tk=S.tok.find(t=>!t.sea); if(tk){ const a=S.atoms[tk.atom], c=(tk.atom%S.cols<S.cols-1)?1:-1; dlTry(tk.id,a.x+c*S.sp/2+((tk.id%2)?9:-9),a.y+((tk.id%3)-1)*16); } }
}
function dlReset(){ dlInit(); renderDrag(); }

    else if(t.dataset.dlg==='skip'){ S.gate=true; } else { const k=+t.dataset.dlg; if(q.o[k]===q.right){ S.gate=true; DL.gwhy=q.why; } else if(!S.gwrong.includes(k)) S.gwrong.push(k); } dlPaint(); return; }
  if(t.dataset.dlt){ DL.tab=t.dataset.dlt; dlInit(); renderDrag(); }
  else if(t.dataset.dll){ const was=DL.lvl; DL.lvl=t.dataset.dll; if(was==='free'||DL.lvl==='free'){ dlInit(); } else DL.S.view=null; renderDrag(); }

});
document.addEventListener('input',e=>{ const t=e.target; if(t&&t.dataset&&t.dataset.dlc!==undefined&&DL.S){ DL.S.chg=DL.S.chg||{}; DL.S.chg[t.dataset.dlc]=t.value; } });

const cp=w=>w[0].toUpperCase()+w.slice(1);
function dlGate(tab,P){
  let Q;
  if(tab==='ionic'){
    const m=EL[P.M], x=EL[P.X], cm=P.cm, an=P.an, u=n=>n+' electron'+(n>1?'s':'');
    Q={p:'Before you start: '+cp(m.n)+' atoms have '+u(m.ve)+' in their outer shell and '+x.n+' atoms have '+x.ve+'. What must happen for each atom to get a full outer shell?',
      right:m.n[0].toUpperCase()+m.n.slice(1)+' loses '+u(cm)+' and '+x.n+' gains '+u(an),
      wrong:[m.n[0].toUpperCase()+m.n.slice(1)+' gains '+u(an)+' and '+x.n+' loses '+u(cm), 'Both atoms lose '+u(cm), 'Both atoms share '+u(Math.min(cm,an))+' in a pair'],
      why:'A metal atom has few outer electrons, so it is easiest to lose '+cm+' and be left with the full shell underneath. A non-metal atom needs '+an+' more, so it gains '+an+'. The transfer gives both a full outer shell.'};
  } else if(tab==='covalent'){
    const c=P.c, e=EL[c], full=c==='H'?2:8, need=full-e.ve;
    const opts=[need,need+1,Math.max(1,need-1),need+2].filter((v,i,a)=>v>0&&a.indexOf(v)===i).slice(0,4);
    while(opts.length<4) opts.push(opts[opts.length-1]+1);
    const f=n=>n+' more electron'+(n>1?'s':'');
    const wr=opts.filter(v=>v!==need).slice(0,3);
    Q={p:'Before you start: '+cp(e.n)+' atoms have '+e.ve+' electron'+(e.ve>1?'s':'')+' in their outer shell. A full outer shell holds '+full+'. How many more electrons does it need?',
      right:f(need), wrong:wr.map(f),
      why:'A full shell needs '+full+', and '+e.n+' already has '+e.ve+', so it needs '+need+' more. Non-metal atoms cannot take electrons from each other, so they share pairs to fill their outer shells.'};
  } else {
    const m=EL[P.M], n=m.ve, u=k=>k+' electron'+(k>1?'s':'');
    Q={p:'Before you start: '+cp(m.n)+' atoms have '+u(n)+' in their outer shell. What happens to them in a metal?',
      right:'All '+n+' become delocalised, leaving a '+chargeText(n,'+')+' ion',
      wrong:[m.n[0].toUpperCase()+m.n.slice(1)+' gains '+(8-n)+' electrons to fill its shell','They are shared in pairs with one neighbouring atom','They stay fixed to their own atom'],
      why:'The outer electrons leave their atoms and move freely. Each atom becomes a '+chargeText(n,'+')+' ion held together by its attraction to the sea of delocalised electrons.'};
  }
  const o=shuffle([Q.right].concat(Q.wrong)); return {p:Q.p,o,right:Q.right,why:Q.why};
}
function dlPlan(S){
  const P=S.P, ve=k=>EL[k].ve;
  if(DL.tab==='ionic') return {f:[
    {l:cp(EL[P.M].n)+': outer electrons in one atom',a:ve(P.M),h:'Use the group number in the periodic table.'},
    {l:cp(EL[P.X].n)+': outer electrons in one atom',a:ve(P.X),h:'Use the group number in the periodic table.'},
    {l:'Electrons each '+EL[P.M].n+' atom loses',a:P.cm,h:'A metal loses its outer electrons to be left with a full shell.'},
    {l:'Electrons each '+EL[P.X].n+' atom gains',a:P.an,h:'A full shell is 8, so gain 8 minus the outer electrons.'},
    {l:'Total electrons that move in '+P.html.replace(/<[^>]+>/g,m=>m),a:S.tgt.length,h:'Number of metal atoms ('+P.a+') × electrons each one loses.'}],
    sum:'Each '+EL[P.M].n+' atom loses '+P.cm+' and each '+EL[P.X].n+' atom gains '+P.an+', so '+S.tgt.length+' electron'+(S.tgt.length>1?'s':'')+' move in total.'};
  if(DL.tab==='covalent'){
    const c=P.c, t=P.t, full=k=>k==='H'?2:8, pairs=S.bonds.reduce((n,b)=>n+b.order,0), f=[{l:cp(EL[c].n)+': outer electrons in one atom',a:ve(c),h:'Use the group number in the periodic table.'}];
    if(t!==c) f.push({l:cp(EL[t].n)+': outer electrons in one atom',a:ve(t),h:'Use the group number in the periodic table.'});
    f.push({l:'Electrons one '+EL[c].n+' atom needs to fill its outer shell',a:full(c)-ve(c),h:'A full shell is '+full(c)+' ('+'2 for hydrogen, 8 for the others)'+'.'});
    f.push({l:'Total shared pairs (covalent bonds) in the molecule',a:pairs,h:'Count the lines in the structural formula. A double bond is 2 pairs.'});
    return {f,sum:'The molecule has '+pairs+' shared pair'+(pairs>1?'s':'')+', so '+(2*pairs)+' electrons are shared in total.'};
  }
  return {f:[
    {l:cp(EL[P.M].n)+': outer electrons in one atom',a:ve(P.M),h:'Use the group number in the periodic table.'},
    {l:'Electrons each atom releases into the sea',a:ve(P.M),h:'Metal atoms release all of their outer electrons.'},
    {l:'Electrons delocalised from the '+S.atoms.length+' atoms shown',a:S.tok.length,h:'Atoms shown × electrons released by each atom.'}],
    sum:'Each atom releases '+ve(P.M)+', so '+S.tok.length+' electrons are delocalised from the atoms shown.'};
}
function dlParseCharge(t){
  t=String(t||'').replace(/\s+/g,'').replace(/[\u2212\u2013\u2014]/g,'-').toLowerCase(); if(!t) return NaN;
  if(t==='0'||t==='neutral'||t==='none') return 0;
  let m=t.match(/^(\d*)([+-])$/); if(m) return (m[2]==='-'?-1:1)*(m[1]===''?1:+m[1]);
  m=t.match(/^([+-])(\d*)$/); if(m) return (m[1]==='-'?-1:1)*(m[2]===''?1:+m[2]);
  return NaN;
}
function dlChgRow(i,res,lab){
  const S=DL.S, v=(S.chg&&S.chg[i])||'';
  return '<div class="fld" style="margin-top:6px"><span>Charge on this '+lab+' ion</span><input type="text" data-dlc="'+i+'" value="'+v.replace(/"/g,'&quot;')+'" placeholder="e.g. 2+" autocomplete="off" spellcheck="false" aria-label="Charge on the '+lab+' atom or ion"'+(res===true?' class="ok"':res===false?' class="bad"':'')+'>'
   +(res===true?'<span class="msg ok" style="margin:0">Correct</span>':res===false?'<span class="msg bad" style="margin:0">Not quite. Count the electrons lost or gained.</span>':'')+'</div>';
}
function dlFreeCard(){
  const S=DL.S, P=S.P, C=S.sc.circles, own=C.map(()=>0), near=C.map(()=>0); let loose=0;
  S.tok.forEach(t=>{ let h=0,hd=1e9; C.forEach((c,i)=>{ const d=Math.hypot(c.x-t.hx,c.y-t.hy); if(d<hd){hd=d;h=i;} }); own[h]++;
    let at=-1; C.forEach((c,i)=>{ if(Math.hypot(c.x-t.x,c.y-t.y)<c.R+16) at=i; }); if(at>=0) near[at]++; else loose++; });
  S.chg=S.chg||{}; S.chgres=S.chgres||{}; const lines=[]; C.forEach((c,i)=>{ const isM=c.label===P.M; if(!isM&&c.label!==P.X) return; const want=isM?own[i]-near[i]:-near[i]; S.want=S.want||{}; S.want[i]=want; const res=S.chgres[i];
    if(isM){ const ch=own[i]-near[i], full=near[i]===0; lines.push('<div style="margin-bottom:12px"><p><b>'+c.label+'</b> (metal): '+near[i]+' of its '+own[i]+' outer electrons left'+(ch? ' &rarr; charge <b>'+(ch>0?ch+'+':(-ch)+'\u2212')+'</b>':' &rarr; neutral')+(full&&ch>0?' <span class="msg ok" style="margin:0">Full shell underneath</span>':'')+'</p>'+dlChgRow(i,res,c.label)+'</div>'); }
    else { const tot=EL[P.X].ve+near[i], ch=near[i]; lines.push('<div style="margin-bottom:12px"><p><b>'+c.label+'</b> (non-metal): '+tot+' outer electrons'+(ch?' &rarr; charge <b>'+ch+'\u2212</b>':' &rarr; neutral')+(tot===8?' <span class="msg ok" style="margin:0">Full shell</span>':'')+'</p>'+dlChgRow(i,res,c.label)+'</div>'); } });
  return '<div class="card"><div class="probhead"><h2>'+cap(P.name)+'</h2><span class="f">'+P.html+'</span></div><p class="q">Drag the pink-cross electrons anywhere you like. Try giving them all to one atom, leaving them on the metal, or splitting them up.</p><div class="explain">'+lines.join('')+(loose?'<p class="note">'+loose+' electron'+(loose>1?'s are':' is')+' not on any atom.</p>':'')+'</div><p class="note">The correct answer: each '+EL[P.M].n+' atom loses '+P.cm+' and each '+EL[P.X].n+' atom gains '+P.an+'. Can you make it?</p><div class="actions"><button class="btn" data-dlx="chg">Check my charges</button><button class="btn ghost" data-dlx="reset">Start again</button></div></div>';
}
function dlGateCard(){
  const S=DL.S, P=S.P, head='<div class="probhead"><h2>'+cap(P.name)+'</h2><span class="f">'+P.html+'</span></div>';
  if(DL.lvl!=='guided'){
    const pl=dlPlan(S), v=S.plan||(S.plan={v:[],bad:[],tries:0}), hint=DL.lvl==='help';
    return '<div class="card">'+head+'<p class="q"><b>Plan first: work out the numbers before you move any electrons.</b></p>'

      +(v.tries?'<p class="msg bad">Not quite. Check the highlighted boxes and try again.</p>':'')

}

/* ---------- Group ions: guided build, common mistakes ---------- */
const gb={on:false,step:0};
function gbP(co){
  const c=co.c,a=co.a; if(c.poly||a.poly||!EL[c.plain]||!EL[a.plain]||!EL[c.plain].metal||EL[a.plain].metal) return null;
  try{ return makeIonic(c.plain,a.plain); }catch(e){ return null; }
}
const gbActive=co=>gb.on&&!!gbP(co);
function gbSteps(co){
  const P=gbP(co), M=EL[P.M].n, X=EL[P.X].n, ve=EL[P.X].ve;
  return [
    {t:'1. Start with the atoms',x:'A '+M+' atom has <b>'+P.cm+'</b> outer electron'+(P.cm>1?'s':'')+' (red ×). A '+X+' atom has <b>'+ve+'</b> (blue •) and needs <b>'+P.an+'</b> more to have a full outer shell of 8.',sc:ionScene(P,'atoms'),arrows:false},
    {t:'2. Transfer the electrons',x:'The metal gives its outer electron'+(P.cm>1?'s':'')+' to the non-metal. These <b>pink crosses come from the metal</b> and land on the '+X+'. Each '+M+' atom loses '+P.cm+' and each '+X+' atom gains '+P.an+'.',sc:ionScene(P,'atoms'),arrows:true},
    {t:'3. Ions with full outer shells',x:'The '+M+' atom is now <b>'+P.M+'<sup>'+chargeText(P.cm,'+')+'</sup></b> (it lost negative electrons, so it is positive). The '+X+' atom is now <b>'+P.X+'<sup>'+chargeText(P.an,'-')+'</sup></b>. The brackets show the charge belongs to the whole ion.',sc:ionScene(P,'final'),arrows:false},

  ];
}
function gbDiagram(co){
  const st=gbSteps(co)[Math.min(gb.step,3)], sc=Object.assign({},st.sc,{arrows:st.arrows?st.sc.arrows:[]});
